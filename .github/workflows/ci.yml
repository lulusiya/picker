name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:dist

  # The demos are the only place the plugin is consumed the way a user would
  # consume it - through `file:..`, which resolves to the built entry points. A
  # broken bundle or a transform that only works from `src/` shows up here and
  # nowhere else, so this job builds both frameworks.
  demos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            demo/package-lock.json
            demo-react/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Vue demo
        working-directory: demo
        run: |
          npm ci
          npm run build
      - name: React demo
        working-directory: demo-react
        run: |
          npm ci
          npm run typecheck
          npm run build
